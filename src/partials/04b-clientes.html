<section class="clientes-secao secao secao--branco" id="clientes" aria-labelledby="clientes-titulo">

    <header class="clientes-secao__cab">
      <span class="rotulo" data-revela>Clientes</span>
      <h2 class="titulo" id="clientes-titulo" data-palavras data-revela="palavras">Empresas que confiam <em>na Ston.</em></h2>
      <p class="texto" data-revela style="--atraso:.15s">Indústrias, usinas, frigoríficos, concessionárias e grupos empresariais que já contaram com a engenharia da Ston.</p>
    </header>
    <!-- esteira no modelo da 079 Criatto, mas com as logos coloridas (pedido do Felipe,
         2026-11-12). Anda sozinha; mouse ou foco pausa; as setas dão um empurrão (04b-clientes.js) -->

      <button class="clientes__seta clientes__seta--ant" type="button" aria-label="Voltar a esteira de clientes" data-anterior><i data-i="arrow-left" data-w="bold"></i></button>
      <div class="clientes__janela">
        <ul class="clientes__trilho" role="list" aria-label="Empresas atendidas pela Ston Engenharia">

        </ul>

      <button class="clientes__seta clientes__seta--prox" type="button" aria-label="Avançar a esteira de clientes" data-proximo><i data-i="arrow-right" data-w="bold"></i></button>
    </div>
  </div>
